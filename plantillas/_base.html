<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tema.css">
{% block estilo %}{% endblock %}
</head>
<body>
{% set modo = 'oscuro' if fondo == 'oscuro' else 'claro' %}
<div class="lienzo {{ modo }}">
  <div class="arriba">
    <span class="etiqueta">{{ etiqueta }}</span>
    {{ logo("simbolo", modo, "simbolo") }}
  </div>
  {% if ejemplo %}<div class="aviso-ejemplo">Negocio de ejemplo</div>{% endif %}
  {% block contenido %}{% endblock %}
  <div class="pie">
    {% block pie %}{% endblock %}
  </div>
</div>
</body>
</html>
