texto: 'Reporte de la semana Nº 1: ¿cuántos negocios chicos tienen web propia?


  Buscamos números públicos. En una encuesta de EE.UU., el 40 % de los negocios chicos tiene web propia; en Facebook está el 50 %. De Argentina no encontramos un dato oficial y preferimos decirlo antes que inventarlo.


  Cada semana armamos un reporte así y lo subimos a galno.com.ar, en la sección Reportes. Este está completo ahí, con todas las fuentes (link en la bio).'
